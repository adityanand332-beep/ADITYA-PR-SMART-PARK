{% extends "base.html" %}{% block content %}<section class="panel auth"><h1>Find your booking</h1><form method="get" class="authform"><label>Booking ID<input name="code" value="{{code}}" placeholder="APR-260101-0001" required></label><button class="btn">Search</button></form>{% if b %}<div class="details"><p>Customer <b>{{b.customer_name}}</b></p><p>Vehicle <b>{{b.vehicle_number}}</b></p><p>Slot <b>{{b.slot_number}}</b></p><p>Status <b>{{b.status}}</b></p><p>Bill <b>₹{{'%.2f'|format(b.fee)}}</b></p><p>Payment <b>{{b.payment_status}}</b></p></div>{% endif %}</section>{% endblock %}
