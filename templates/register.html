{% extends "base.html" %}{% block content %}<section class="panel auth"><p class="eyebrow">CUSTOMER ACCOUNT</p><h1>Create your account</h1><p class="muted">Register once to book slots and view your booking history.</p><form method="post" class="authform"><label>Full name<input name="full_name" required maxlength="80"></label><label>Mobile number<input name="mobile" pattern="[0-9]{10,13}" placeholder="10–13 digit mobile" required></label><label>Email (optional)<input name="email" type="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" minlength="6" required></label><label>Confirm password<input name="confirm_password" type="password" minlength="6" required></label><button class="btn">Create Account</button></form><p>Already registered? <a href="/customer/login">Login here</a>.</p></section>{% endblock %}
